# Functional and provenance checks: "is this a sane, sealed, correctly-built image?"
# Run inside the build VM by packer/scripts/linux/gates.sh -> goss.json -> `goss` gate.
# Rendered as a Go template. Environment: FLAVOR, and DISTRO_FAMILY (redhat | debian) which selects package and service names.
# Keep every resource type under ONE top-level key: goss silently drops all but the last duplicate.

file:
  /etc/imagefactory-release:
    exists: true
    contains:
      # goss treats a string as a literal unless the WHOLE pattern is wrapped in slashes.
      - "/^IMAGEFACTORY_VERSION={{ .Env.FLAVOR }}-[0-9]{8}\\.[0-9]+$/"
      - "IMAGEFACTORY_BASELINE="
      - "IMAGEFACTORY_COMMIT="
  # Sealed: machine identity must not ship (regenerated per instance at first boot).
  /etc/ssh/ssh_host_ed25519_key:
    exists: false
  /etc/ssh/ssh_host_rsa_key:
    exists: false
  /etc/ssh/sshd_config.d/00-imagefactory.conf:
    exists: true
    mode: "0600"

command:
  machine-id-empty:
    exec: test ! -s /etc/machine-id
    exit-status: 0
  sshd-config-valid:
    exec: sshd -t -h /tmp/imagefactory-tools/hostkey
    exit-status: 0
  no-pending-security-updates:
{{ if eq .Env.DISTRO_FAMILY "debian" }}
    # cleanup.sh removed apt's package lists, so refresh them first; otherwise "nothing to upgrade" would pass vacuously.
    exec: >-
      sh -c 'apt-get -qq update && ! apt-get -s -o Debug::NoLocking=1 dist-upgrade | grep -E "^Inst .*-security"'
{{ else }}
    exec: >-
      sh -c 'dnf -q check-update --security; test $? -ne 100'
{{ end }}
    exit-status: 0
    timeout: 300000
{{ if eq .Env.DISTRO_FAMILY "debian" }}
  sshd-enabled:
    # Ubuntu 24.04 starts sshd by socket activation (ssh.socket), so ssh.service itself may report "disabled".
    exec: >-
      sh -c 'systemctl is-enabled ssh.socket ssh.service 2>/dev/null | grep -qx enabled'
    exit-status: 0
{{ end }}

package:
  cloud-init:
    installed: true
  chrony:
    installed: true
{{ if eq .Env.DISTRO_FAMILY "debian" }}
  auditd:
    installed: true
  # Insecure legacy services must not be present.
  telnetd:
    installed: false
  rsh-server:
    installed: false
  nis:
    installed: false
  tftpd-hpa:
    installed: false
{{ else }}
  audit:
    installed: true
  # Insecure legacy services must not be present.
  telnet-server:
    installed: false
  rsh-server:
    installed: false
  ypserv:
    installed: false
  tftp-server:
    installed: false
{{ end }}

service:
  auditd:
    enabled: true
  cloud-init:
    enabled: true
{{ if eq .Env.DISTRO_FAMILY "debian" }}
  chrony:
    enabled: true
{{ else }}
  sshd:
    enabled: true
  chronyd:
    enabled: true
{{ if hasPrefix "al2023" .Env.FLAVOR }}
  # Amazon Linux ships the SSM agent (al2023 AND al2023arm); fleet patching and Session Manager depend on it.
  amazon-ssm-agent:
    enabled: true
{{ end }}
{{ end }}
