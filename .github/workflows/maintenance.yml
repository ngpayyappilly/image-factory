# Weekly retention: deprecate versions outside N / N-1, delete those deprecated for 60+ days.
# Manual runs are a dry run unless `apply` is ticked; the weekly schedule applies it.
name: Retention

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: imagefactory-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ${{ vars.IMAGEFACTORY_RUNNER || 'ubuntu-24.04' }}
    environment: imagefactory-maintenance
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROMOTER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sign in to Azure (promoter identity)
        if: ${{ vars.AZURE_TENANT_ID != '' }}       # only when Azure is set up (terraform/azure-bootstrap)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PROMOTER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Retention
        env:
          EVENT: ${{ github.event_name }}
          APPLY: ${{ inputs.apply }}
          OWNER: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          apply=""
          if [ "$EVENT" = schedule ] || [ "$APPLY" = true ]; then apply="--apply"; fi
          status=0
          for f in $(imagefactory matrix | python -c 'import json,sys; print(*{r["flavor"] for r in json.load(sys.stdin)})'); do
            # Same per-flavor lock as promote.yml: retention never races a promotion or rollback.
            imagefactory lock acquire --name "channels-$f" --owner "$OWNER" --ttl-minutes 60 --wait-minutes 10 || { status=1; continue; }
            imagefactory retention --flavor "$f" $apply || status=1
            imagefactory lock release --name "channels-$f" --owner "$OWNER" || true
          done
          exit $status
