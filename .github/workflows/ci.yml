# Validation for pull requests and main: everything that can run without cloud access.
# Runs `make check`: unit tests, `packer validate` for every flavor x platform, Ansible syntax,
# actionlint, `terraform validate` + fmt. No AWS credentials and no id-token: a pull request (including
# one from a fork) cannot reach AWS, the build roles, or any secret from this workflow.
#
# Make the `CI / check` and `CI / unit-tests-py39` jobs required status checks on `main`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true         # a newer push supersedes the older run

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ vars.PACKER_VERSION || 'latest' }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Check everything that runs offline
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}   # avoids anonymous rate limits when `packer init` fetches plugins
        run: make setup check

  # The code must keep working on the oldest supported Python (3.9); `check` above runs 3.12.
  unit-tests-py39:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
