[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imagefactory"
version = "0.1.0"
description = "Golden image pipeline: build once, gate, promote through channels, publish to AWS (and optionally Azure/GCP/VMware)"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6", "boto3>=1.36"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
imagefactory = "imagefactory.cli:main"

[tool.setuptools]
packages = ["imagefactory", "imagefactory.platforms"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
